dataset:
  name: "SMD"
  train_file: "./data/ServerMachineDataset/train/"
  test_file: "./data/ServerMachineDataset/test/"
  modality: "metric"

  format:
    header: null
    sep: ","
    label_col: null
    pattern: "*.txt"

  cleaning:
    auto_clean: true
    drop_constant: true
    drop_high_nan: 0.5
    fill_nan: "linear"

  window_size: 100
  normalization: "minmax"

  vocab_size: 397
  embedding_dim: 16
  max_len: 50

model:
  hidden_dim: 64
  z_dim: 32
  lnt_pool_bins: 1
  backbone_version: "lnt_v2_slotwise"   # legacy / lnt_v2_slotwise
  lnt_num_slots: 2
  lnt_slot_agg: "gated_sum"             # gated_sum / flatten_linear
  gat_mode: "slotwise_shared"           # legacy / slotwise_shared
  local_global_fusion: "gated"          # sum / gated
  return_slot_debug: true
  use_slot_pos_embedding: true
  use_prototype_fusion: true
  prototype:
    use_node_prototype: true
    use_patch_prototype: false
    use_node_correction: true
    use_patch_correction: false
    use_global_prototype: true
    use_local_prototype: false
    num_node_prototypes: 8
    num_patch_prototypes: 8
    tau_node: 0.1
    tau_patch: 0.1
    lambda_node: 0.5
    lambda_patch: 0.3
    lambda_node_proto_loss: 0.02
    lambda_patch_proto_loss: 0.02
    lambda_corr_loss: 0.005
    lambda_node_balance: 0.001
    lambda_patch_balance: 0.001
    patch_size: 10
    fusion_mode: "residual_add"

train:
  batch_size: 256
  epochs: 70
  lr: 0.0005
  patience: 10
  recon_mode: "mixed"
  lambda_recon_last: 1.0
  lambda_recon_full: 0.2
  lambda_window_repr_cl: 0.0
  checkpoint_mode: "pa_f1"
  val_eval_interval: 5
  val_subset_max_batches: 20

prototype_v2:
  enable: true
  warmup:
    enable: true
    warmup_epochs: 10
    use_raw_heads_during_warmup: true
    disable_proto_losses_during_warmup: true
  pseudo_split:
    enable: true
    score_source: "raw_pred_recon"
    core_percentile: 95.0
    tail_percentile: 99.0
    gray_zone_enable: true
    save_path: "outputs/prototype_v2_pseudo_split.json"
  kmeans_init:
    enable: true
    init_after_warmup: true
    latent_source: "z_fused"
    max_samples: 50000
    num_iters: 30
    random_seed: 42
    save_path: "outputs/prototype_v2_init_audit.json"
  usage_floor:
    enable: true
    min_usage: 0.03
    lambda_usage_floor: 0.001
  repulsion:
    enable: true
    margin: 0.5
    lambda_repulsion: 0.001
    metric: "l2"
  proto_nce:
    enable: true
    lambda_proto_nce: 0.005
    tau: 0.1
    use_stopgrad_assignment: true
  correction_gate:
    enable: true
    mode: "entropy"
    min_gate: 0.05
    max_gate: 1.0
    detach_gate: true
  pseudo_tail:
    enable_weak_repulsion: false
    lambda_tail_repulsion: 0.001
    margin: 0.5
  audit:
    save_pairwise_proto_stats: true
    save_gate_stats: true

inference:
  alpha_pred: 1.0
  beta_recon: 1.0
  ema_alpha: 0.2
  high_percentile: 99.0
  low_percentile: 95.0
  use_isolation: true
  replacement_mix: 0.5
  hybrid_w_corrected: 1.0
  hybrid_w_corr_norm: 0.35
  hybrid_w_branch_gap: 0.25
  hybrid_w_proto_uncertainty: 0.20
  hybrid_w_spike: 0.30
  min_anomaly_persistence: 3
  save_anomaly_segments: true
  anomaly_segment_csv: "outputs/anomaly_segments.csv"
  anomaly_segment_pkl: "outputs/anomaly_segments.pkl"
  anomaly_cluster_json: "outputs/anomaly_clusters.json"

anomaly_space:
  enable_memory_bank: true
  use_learnable_segment_encoder: false
  segment_repr_mode: "static_concat"  # learnable / static_concat
  segment_repr_dim: 64
  segment_pool_mode: "attentive"
  clustering_method: "agglomerative"
  num_anomaly_clusters: 8
  unknown_similarity_threshold: 0.55
