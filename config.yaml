# ==========================================
# 🎛️ 智能配置 (Smart Config) - 修复版
# ==========================================

dataset:
  name: "SMD"       # 名字改成 SMD 比较直观
  train_file: "./data/ServerMachineDataset/train/"
  test_file: "./data/ServerMachineDataset/test/"
  
  # 【关键修改】必须改成 metric，因为 SMD 是指标数据
  modality: "metric"

  format:
    header: null       
    sep: ","          
    label_col: null    
    pattern: "*.txt"

  # === 自动清洗 ===
  cleaning:
    auto_clean: true        
    drop_constant: true     
    drop_high_nan: 0.5      
    fill_nan: "linear"      

  # 预处理
  window_size: 100
  normalization: "minmax"
  
  # 下面这些 Log 配置在 metric 模式下会被忽略，留着没事
  vocab_size: 397     
  embedding_dim: 16   
  max_len: 50

model:
  hidden_dim: 64
  z_dim: 32
  encoder:
    kernel_sizes: [3, 5, 9, 17]
    head_channels: 8
    dropout: 0.1

train:
  batch_size: 256
  epochs: 70
  lr: 0.0005
  patience: 10

inference:
  alpha_pred: 1.0
  beta_recon: 1.0
  ema_alpha: 0.2
  high_percentile: 99.0
  low_percentile: 95.0
  use_isolation: true
  replacement_mix: 0.5
